name: Art Tooling

on:
  push:
    branches: [main]
    paths:
      - "tools/art/**"
      - ".github/workflows/art-tooling.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/art/**"
      - ".github/workflows/art-tooling.yml"

permissions:
  contents: read

jobs:
  turnaround-prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install art tooling dependencies
        run: python -m pip install -r tools/art/requirements.txt

      - name: Run turnaround preparation tests
        run: python -m unittest discover -s tools/art -p 'test_*.py' -v
