name: Godot Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download CJK UI font
        run: |
          mkdir -p fonts
          curl -fL --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf" \
            -o fonts/NotoSansSC-Regular.otf
          test -s fonts/NotoSansSC-Regular.otf

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Verify Godot
        run: godot --version

      - name: Import project and register scripts
        run: godot --headless --path . --editor --quit

      - name: Check signature parser probe
        run: godot --headless --path . --check-only --script res://tests/gdscript_signature_probe.gd

      - name: Check EventRuntime directly
        run: godot --headless --path . --check-only --script res://scripts/narrative/event_runtime.gd

      - name: Check EventRunner directly
        run: godot --headless --path . --check-only --script res://scripts/narrative/event_runner.gd

      - name: Run headless runtime suite
        run: godot --headless --path . --script res://tests/runtime_suite.gd

      - name: Trace remaining ObjectDB teardown warning
        if: success()
        run: |
          set +e
          godot --headless --verbose --path . --script res://tests/runtime_suite.gd > /tmp/runtime_verbose.log 2>&1
          runtime_status=$?
          set -e
          echo "Verbose runtime suite exit: ${runtime_status}"
          echo "Filtered teardown detail:"
          grep -n -E -i -C 2 "ObjectDB instances leaked|Leaked instance|resources still in use|leaked at exit|ObjectDB.*leak" /tmp/runtime_verbose.log | tail -n 200 || true
          exit "${runtime_status}"
