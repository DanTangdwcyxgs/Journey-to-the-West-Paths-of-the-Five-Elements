name: Godot Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Verify Godot
        run: godot --version

      - name: Import project and register scripts
        run: godot --headless --path . --editor --quit

      - name: Check signature parser probe
        run: godot --headless --path . --check-only --script res://tests/gdscript_signature_probe.gd

      - name: Check EventRuntime directly
        run: godot --headless --path . --check-only --script res://scripts/narrative/event_runtime.gd

      - name: Run headless runtime suite
        run: godot --headless --path . --script res://tests/runtime_suite.gd
