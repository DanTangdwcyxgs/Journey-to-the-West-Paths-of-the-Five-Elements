name: Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Web Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.5.1 with Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Download CJK font for Web build
        run: |
          mkdir -p fonts
          curl -fL --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf" \
            -o fonts/NotoSansSC-Regular.otf
          test -s fonts/NotoSansSC-Regular.otf

      - name: Verify Godot
        run: godot --version

      - name: Warm up Godot asset import
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --editor --quit 2>&1 | tee build/import-warmup.log || true

      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee build/import.log
          if grep -Eq 'SCRIPT ERROR: Parse Error|Failed to load script ".*" with error "Parse error"' build/import.log; then
            echo "::error::Godot project import reported script parse errors."
            exit 1
          fi

      - name: Run runtime suite before export
        run: godot --headless --path . --script res://tests/runtime_suite.gd

      - name: Export Web build
        run: |
          set -o pipefail
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee build/export.log
          if grep -Eq 'SCRIPT ERROR: Parse Error|Failed to load script ".*" with error "Parse error"' build/export.log; then
            echo "::error::Godot Web export reported script parse errors."
            exit 1
          fi
          test -f build/web/index.html
          test -f build/web/index.pck
          test -f build/web/index.wasm
          test -f build/web/index.js

      - name: Add demo landing page
        run: |
          cat > build/web/README.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>西游：五行之路 Demo</title>
            <meta http-equiv="refresh" content="0; url=./index.html">
          </head>
          <body>
            正在进入《西游：五行之路》Demo…
          </body>
          </html>
          EOF

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy Web Demo
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
